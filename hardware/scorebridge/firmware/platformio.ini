; ScoreBridge firmware. Build/flash:  pio run -t upload      (USB-C; hold BOOT if the upload doesn't start)
; Arduino IDE instead: open ScoreBridge/ScoreBridge.ino, board "ESP32 Dev Module" (or "WT32-ETH01"), upload.
[platformio]
src_dir = ScoreBridge

[env:wt32-eth01]
platform = espressif32@6.9.0
board = wt32-eth01
framework = arduino
monitor_speed = 115200
upload_speed = 460800
build_flags = -DCORE_DEBUG_LEVEL=0
